<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="《大個子和小不點兒》小學二年級3D沉浸式第一人稱視角體驗遊戲，體驗不同身高看到的世界。">
    <meta name="theme-color" content="#cbe8f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="大個子和小不點兒">
    <!-- Inline SVG Favicon for GitHub Pages (Zero 404 errors) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐭</text></svg>">
    <title>《大個子和小不點兒》3D第一人稱視角體驗遊戲</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts: Rounded Kid-Friendly Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            width: 100dvw;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
            background-color: #cbe8f6;
            position: fixed;
            inset: 0;
        }
        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
            touch-action: none;
        }
        canvas:active {
            cursor: grabbing;
        }
        /* Storybook UI Styling optimized for iPad */
        .storybook-panel {
            background: rgba(255, 252, 242, 0.95);
            border: 3px solid #eab308;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15), inset 0 2px 0 rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
        }
        .btn-3d {
            transition: all 0.15s ease;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);
            touch-action: manipulation;
        }
        .btn-3d:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }
        .role-active-big {
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white;
            border-color: #ffffff;
        }
        .role-active-small {
            background: linear-gradient(135deg, #f59e0b, #eab308);
            color: #451a03;
            border-color: #ffffff;
        }
        /* Floating 3D HTML Side Labels - Never Blocking the 3D Object */
        .label-3d {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: opacity 0.25s ease, filter 0.25s ease;
            z-index: 15;
            touch-action: manipulation;
        }
        .label-3d.label-side-right {
            transform: translate(0%, -50%);
        }
        .label-3d.label-side-left {
            transform: translate(-100%, -50%);
        }
        .label-3d.label-active:hover .label-pill,
        .label-3d.label-active:active .label-pill {
            transform: scale(1.08);
        }
        .label-3d.label-disabled {
            display: none !important;
            pointer-events: none;
        }
        @keyframes floatPulse {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .animate-float {
            animation: floatPulse 2.2s infinite ease-in-out;
        }
        @keyframes blinkHighlight {
            0%, 100% {
                opacity: 1;
                transform: scale(1.08);
                background-color: #ef4444;
                color: #ffffff;
                box-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
            }
            50% {
                opacity: 0.35;
                transform: scale(0.95);
                background-color: #fde047;
                color: #991b1b;
                box-shadow: 0 0 4px rgba(250, 204, 21, 0.6);
            }
        }
        .blink-lifted {
            animation: blinkHighlight 0.85s infinite ease-in-out;
            padding: 3px 6px;
            border-radius: 8px;
            display: inline-block;
        }
        /* Height ruler bar indicator */
        .height-track {
            background: repeating-linear-gradient(
                to bottom,
                #fde68a,
                #fde68a 10px,
                #fef3c7 10px,
                #fef3c7 20px
            );
        }
    </style>
</head>
<body>

    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Floating 3D Interactive Labels Container -->
    <div id="labels-container" class="absolute inset-0 pointer-events-none overflow-hidden z-10"></div>

    <!-- Center Crosshair / Eye Focus Indicator -->
    <div id="eye-crosshair" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none z-10 flex flex-col items-center opacity-75">
        <div class="w-11 h-11 rounded-full border-2 border-dashed border-white shadow-md flex items-center justify-center bg-black/10">
            <div class="w-2.5 h-2.5 rounded-full bg-yellow-300"></div>
        </div>
        <span id="eye-level-hint" class="mt-1 px-2.5 py-0.5 rounded-full bg-black/45 text-white text-xs sm:text-sm font-bold tracking-wider whitespace-nowrap">
            正前方平視線
        </span>
    </div>

    <!-- Welcome / Character Selection Modal -->
    <div id="welcome-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-sky-900/60 backdrop-blur-sm p-4">
        <div class="storybook-panel max-w-2xl w-full rounded-3xl p-6 md:p-8 text-center relative overflow-hidden">
            <!-- Decorative Sun from reference illustration -->
            <div class="w-20 h-20 rounded-full bg-orange-400 mx-auto mb-3 flex items-center justify-center shadow-lg border-4 border-dashed border-orange-300">
                <span class="text-4xl">☀️</span>
            </div>
            <h1 class="text-3xl md:text-4xl font-black text-amber-900 mb-2 tracking-tight">
                《大個子和小不點兒》
            </h1>
            <p class="text-base md:text-lg text-amber-950 font-bold mb-6">
                從前，有一隻個子很大的老鼠和一隻個子很小的老鼠。他們兩個是好朋友。
            </p>

            <!-- Character Cards matching reference illustration -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                <!-- Big Mouse Card -->
                <div onclick="startGameWithRole('big')" class="cursor-pointer group bg-gradient-to-b from-red-50 to-orange-100 hover:from-red-100 hover:to-orange-200 border-4 border-red-400 rounded-2xl p-4 flex flex-col items-center justify-between transition transform hover:-translate-y-1 shadow-md">
                    <div class="flex flex-col items-center">
                        <div class="w-24 h-24 rounded-full bg-white border-4 border-red-400 flex items-center justify-center mb-2 shadow-inner relative">
                            <!-- SVG Big Mouse in Red Dress/Suit -->
                            <svg viewBox="0 0 100 100" class="w-20 h-20">
                                <circle cx="32" cy="24" r="14" fill="#7c8594" stroke="#525866" stroke-width="2"/>
                                <circle cx="32" cy="24" r="8" fill="#fca5a5"/>
                                <circle cx="65" cy="24" r="14" fill="#7c8594" stroke="#525866" stroke-width="2"/>
                                <circle cx="65" cy="24" r="8" fill="#fca5a5"/>
                                <ellipse cx="52" cy="40" rx="20" ry="16" fill="#8b95a5"/>
                                <circle cx="68" cy="38" r="3" fill="#1e293b"/>
                                <circle cx="58" cy="36" r="2.8" fill="#111827"/>
                                <circle cx="54" cy="44" r="4" fill="#fda4af" opacity="0.7"/>
                                <path d="M34 54 L66 54 L74 92 L26 92 Z" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
                            </svg>
                        </div>
                        <h2 class="text-2xl font-black text-red-700">當“大個子”</h2>
                        <p class="text-sm text-amber-900 mt-1 font-medium">
                            穿紅衣服的大老鼠，個子很高！<br>常看到高處的東西。
                        </p>
                    </div>
                    <button type="button" onclick="event.stopPropagation(); startGameWithRole('big')" class="btn-3d mt-4 w-full bg-red-500 hover:bg-red-600 text-white font-black py-2.5 px-4 rounded-xl text-base shadow-md">
                        選我開始故事
                    </button>
                </div>

                <!-- Small Mouse Card -->
                <div onclick="startGameWithRole('small')" class="cursor-pointer group bg-gradient-to-b from-amber-50 to-yellow-100 hover:from-amber-100 hover:to-yellow-200 border-4 border-amber-400 rounded-2xl p-4 flex flex-col items-center justify-between transition transform hover:-translate-y-1 shadow-md">
                    <div class="flex flex-col items-center">
                        <div class="w-24 h-24 rounded-full bg-white border-4 border-amber-400 flex items-center justify-center mb-2 shadow-inner relative">
                            <!-- SVG Little Mouse in Yellow Dress/Suit -->
                            <svg viewBox="0 0 100 100" class="w-16 h-16 mt-3">
                                <circle cx="32" cy="28" r="14" fill="#7c8594" stroke="#525866" stroke-width="2"/>
                                <circle cx="32" cy="28" r="8" fill="#fca5a5"/>
                                <circle cx="65" cy="28" r="14" fill="#7c8594" stroke="#525866" stroke-width="2"/>
                                <circle cx="65" cy="28" r="8" fill="#fca5a5"/>
                                <ellipse cx="48" cy="44" rx="19" ry="15" fill="#8b95a5"/>
                                <circle cx="33" cy="42" r="3" fill="#1e293b"/>
                                <circle cx="42" cy="40" r="2.8" fill="#111827"/>
                                <circle cx="46" cy="48" r="4" fill="#fda4af" opacity="0.7"/>
                                <path d="M32 58 L64 58 L70 90 L26 90 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
                            </svg>
                        </div>
                        <h2 class="text-2xl font-black text-amber-800">當“小不點兒”</h2>
                        <p class="text-sm text-amber-900 mt-1 font-medium">
                            穿黃衣服的小老鼠，個子小小！<br>常看到低處的東西。
                        </p>
                    </div>
                    <button type="button" onclick="event.stopPropagation(); startGameWithRole('small')" class="btn-3d mt-4 w-full bg-amber-500 hover:bg-amber-600 text-white font-black py-2.5 px-4 rounded-xl text-base shadow-md">
                        選我開始故事
                    </button>
                </div>
            </div>

            <div class="bg-amber-100/80 rounded-xl p-3 text-sm text-amber-900 font-bold flex flex-wrap items-center justify-center gap-2">
                <span>💡 貼心小提醒：進入故事後，隨時都可以切換角色視角，比較看看兩隻老鼠看到的東西呢！</span>
            </div>
        </div>
    </div>

    <!-- TOP NAVIGATION BAR: Role Switcher & Ordered Scenes with Arrows (Optimized for iPad) -->
    <div class="fixed top-3 left-3 right-3 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
        
        <!-- Left: Role Switcher (First-Person Height Switch) -->
        <div class="storybook-panel rounded-2xl p-1.5 flex items-center gap-2 pointer-events-auto">
            <span class="text-sm font-black text-amber-900 px-2 hidden md:inline">我是：</span>
            <button id="btn-role-big" onclick="switchRole('big')" class="btn-3d px-3 py-1.5 rounded-xl font-black text-sm md:text-base flex items-center gap-2 border-2 border-transparent bg-red-100 text-red-900">
                <span class="w-7 h-7 rounded-full bg-white border-2 border-red-400 flex items-center justify-center shadow-inner shrink-0 overflow-hidden">
                    <svg viewBox="0 0 100 100" class="w-6 h-6">
                        <circle cx="32" cy="24" r="14" fill="#7c8594" stroke="#525866" stroke-width="2"/>
                        <circle cx="32" cy="24" r="8" fill="#fca5a5"/>
                        <circle cx="65" cy="24" r="14" fill="#7c8594" stroke="#525866" stroke-width="2"/>
                        <circle cx="65" cy="24" r="8" fill="#fca5a5"/>
                        <ellipse cx="52" cy="40" rx="20" ry="16" fill="#8b95a5"/>
                        <circle cx="68" cy="38" r="3" fill="#1e293b"/>
                        <circle cx="58" cy="36" r="2.8" fill="#111827"/>
                        <circle cx="54" cy="44" r="4" fill="#fda4af" opacity="0.7"/>
                        <path d="M34 54 L66 54 L74 92 L26 92 Z" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
                    </svg>
                </span>
                <span>大個子</span>
            </button>
            <button id="btn-role-small" onclick="switchRole('small')" class="btn-3d px-3 py-1.5 rounded-xl font-black text-sm md:text-base flex items-center gap-2 border-2 border-transparent bg-amber-100 text-amber-900">
                <span class="w-7 h-7 rounded-full bg-white border-2 border-amber-400 flex items-center justify-center shadow-inner shrink-0 overflow-hidden">
                    <svg viewBox="0 0 100 100" class="w-5 h-5 mt-1">
                        <circle cx="32" cy="28" r="14" fill="#7c8594" stroke="#525866" stroke-width="2"/>
                        <circle cx="32" cy="28" r="8" fill="#fca5a5"/>
                        <circle cx="65" cy="28" r="14" fill="#7c8594" stroke="#525866" stroke-width="2"/>
                        <circle cx="65" cy="28" r="8" fill="#fca5a5"/>
                        <ellipse cx="48" cy="44" rx="19" ry="15" fill="#8b95a5"/>
                        <circle cx="33" cy="42" r="3" fill="#1e293b"/>
                        <circle cx="42" cy="40" r="2.8" fill="#111827"/>
                        <circle cx="46" cy="48" r="4" fill="#fda4af" opacity="0.7"/>
                        <path d="M32 58 L64 58 L70 90 L26 90 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
                    </svg>
                </span>
                <span>小不點兒</span>
            </button>
        </div>

        <!-- Center: Ordered Scenes Selector with "打招呼時" before "散步時" and Clear Order Arrows (➔) -->
        <div class="storybook-panel rounded-2xl p-1.5 flex flex-wrap items-center justify-center gap-1 sm:gap-1.5 pointer-events-auto">
            <button id="scene-btn-greet" onclick="changeToGreetingScene()" class="btn-3d px-3 py-2 rounded-xl text-xs md:text-sm font-black transition">
                打招呼時
            </button>
            <!-- Clear Order Arrow Greet -> 1 -->
            <div class="text-amber-600 font-black text-base md:text-lg px-0.5 flex items-center select-none" aria-hidden="true">
                <svg class="w-4 h-4 md:w-5 md:h-5 text-amber-600 drop-shadow-sm" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 12h14"/>
                </svg>
            </div>
            <button id="scene-btn-0" onclick="changeScene(0)" class="btn-3d px-3 py-2 rounded-xl text-xs md:text-sm font-black transition">
                1. 散步時
            </button>
            <!-- Clear Order Arrow 1 -> 2 -->
            <div class="text-amber-600 font-black text-base md:text-lg px-0.5 flex items-center select-none" aria-hidden="true">
                <svg class="w-4 h-4 md:w-5 md:h-5 text-amber-600 drop-shadow-sm" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 12h14"/>
                </svg>
            </div>
            <button id="scene-btn-1" onclick="changeScene(1)" class="btn-3d px-3 py-2 rounded-xl text-xs md:text-sm font-black transition">
                2. 走過院子時
            </button>
            <!-- Clear Order Arrow 2 -> 3 -->
            <div class="text-amber-600 font-black text-base md:text-lg px-0.5 flex items-center select-none" aria-hidden="true">
                <svg class="w-4 h-4 md:w-5 md:h-5 text-amber-600 drop-shadow-sm" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 12h14"/>
                </svg>
            </div>
            <button id="scene-btn-2" onclick="changeScene(2)" class="btn-3d px-3 py-2 rounded-xl text-xs md:text-sm font-black transition">
                3. 走到屋子旁邊時
            </button>
            <!-- Clear Order Arrow 3 -> 4 -->
            <div class="text-amber-600 font-black text-base md:text-lg px-0.5 flex items-center select-none" aria-hidden="true">
                <svg class="w-4 h-4 md:w-5 md:h-5 text-amber-600 drop-shadow-sm" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 12h14"/>
                </svg>
            </div>
            <button id="scene-btn-3" onclick="changeScene(3)" class="btn-3d px-3 py-2 rounded-xl text-xs md:text-sm font-black transition">
                4. 在屋內時
            </button>
        </div>

        <!-- Right: Progress Badge -->
        <div class="storybook-panel rounded-2xl p-1.5 flex items-center gap-2 pointer-events-auto">
            <button onclick="toggleNotebookModal()" class="btn-3d bg-emerald-500 hover:bg-emerald-600 text-white px-3.5 py-2 rounded-xl text-xs md:text-sm font-black flex items-center gap-1.5">
                <span>📖 課文集章</span>
                <span id="stamp-counter" class="bg-white text-emerald-800 px-2 py-0.5 rounded-full text-xs font-black">0/11</span>
            </button>
        </div>
    </div>

    <!-- LEFT SIDE: Visual Eye-Level Height Meter -->
    <div class="fixed left-3 top-1/2 -translate-y-1/2 z-20 flex flex-col items-center storybook-panel rounded-2xl p-2.5 w-20 pointer-events-auto">
        <div class="text-xs font-black text-amber-900 text-center leading-tight mb-1.5">眼睛高度</div>
        <div class="relative w-7 h-48 rounded-full height-track border-2 border-amber-500 overflow-hidden shadow-inner">
            <!-- High line marker -->
            <div class="absolute top-3 inset-x-0 border-b-2 border-dashed border-red-500"></div>
            <!-- Low line marker -->
            <div class="absolute bottom-4 inset-x-0 border-b-2 border-dashed border-amber-600"></div>
            <!-- Moving Eye Indicator -->
            <div id="height-indicator-dot" class="absolute left-1/2 -translate-x-1/2 w-6 h-6 rounded-full bg-red-500 border-2 border-white shadow-md transition-all duration-500 flex items-center justify-center text-xs" style="top: 8px;">
                👀
            </div>
        </div>
        <div id="height-label-text" class="mt-2 text-xs font-black text-red-600 text-center leading-tight">
            高處
        </div>
    </div>

    <!-- SPECIAL SCENE EVENT BAR (Greeting Step / Rain Toggle in Scene 3 / Lift Up in Scene 4) -->
    <div id="special-action-bar" class="fixed top-20 left-1/2 -translate-x-1/2 z-20 pointer-events-auto hidden">
        <!-- Populated dynamically -->
    </div>

    <!-- BOTTOM PANEL: Speech Bubble, Read Aloud + Next Location, & "用眼睛看四周" Icon Controls -->
    <div class="fixed bottom-3 left-3 right-3 z-20 flex flex-row items-end justify-between gap-3 pointer-events-none">
        
        <!-- Speech & Textbook Dialogue Box -->
        <div class="storybook-panel rounded-3xl p-4 flex-1 max-w-3xl pointer-events-auto flex flex-row items-center gap-3.5">
            <!-- Speaker Avatar Badge (Matches Role Switcher Icons) -->
            <div id="speaker-badge" class="w-16 h-16 md:w-20 md:h-20 rounded-2xl bg-red-500 text-white flex flex-col items-center justify-center shrink-0 border-2 border-white shadow-md">
                <div id="speaker-icon-container" class="flex items-center justify-center"></div>
                <span id="speaker-name" class="text-xs md:text-sm font-black mt-0.5">大個子説</span>
            </div>

            <!-- Dialogue Text & Scene Narration -->
            <div class="flex-1 text-left min-h-[3.5rem] flex flex-col justify-center">
                <div id="speech-text" class="text-2xl md:text-3xl font-black text-slate-800 tracking-wide leading-snug"></div>
                <div id="vision-explanation" class="text-xs md:text-sm font-bold text-amber-800 mt-1.5"></div>
            </div>

            <!-- Right Column: "🔊 朗讀" Button & "🗺️ 下一個情境 ➔" Button underneath -->
            <div class="flex flex-col gap-2 shrink-0">
                <button id="btn-read-aloud" onclick="replayCurrentSpeech()" class="btn-3d bg-sky-500 hover:bg-sky-600 text-white px-5 py-2.5 rounded-2xl font-black text-base md:text-lg flex items-center justify-center gap-2 opacity-50 pointer-events-none">
                    <span class="text-xl">🔊</span>
                    <span>朗讀</span>
                </button>
                <button id="btn-next-scene" onclick="goToNextLocation()" class="btn-3d bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-2xl font-black text-sm md:text-base flex items-center justify-center gap-1.5">
                    <span class="text-lg">🗺️</span>
                    <span>下一個情境</span>
                    <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 12h14"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- "用眼睛看四周" Control Panel (Vertical Only, Icons Only, No Chinese inside buttons) -->
        <div class="storybook-panel rounded-3xl p-3 pointer-events-auto flex flex-col items-center justify-center shrink-0">
            <span class="text-xs md:text-sm font-black text-amber-900 mb-2 tracking-wide">用眼睛看四周</span>
            <div class="flex flex-col items-center gap-2">
                <!-- Look Up Icon Button -->
                <button onclick="nudgeCamera(0, 0.25)" class="btn-3d bg-amber-200 hover:bg-amber-300 text-amber-950 w-16 h-12 rounded-2xl flex items-center justify-center border-2 border-amber-400" aria-label="Look Up">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/>
                    </svg>
                </button>

                <!-- Look Straight Ahead / Eye Icon Button -->
                <button onclick="resetLookFront()" class="btn-3d bg-white hover:bg-amber-50 text-amber-950 w-16 h-12 rounded-2xl flex items-center justify-center border-2 border-amber-400" aria-label="Look Straight Ahead">
                    <svg class="w-8 h-8 text-amber-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playChimeSound(type = 'greet') {
            try {
                initAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'greet') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);       // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.09); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.18); // G5
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                    osc.start(now);
                    osc.stop(now + 0.45);
                } else if (type === 'switch') {
                    osc.type = 'sine';
                    const startFreq = currentRole === 'big' ? 320 : 620;
                    const endFreq = currentRole === 'big' ? 580 : 340;
                    osc.frequency.setValueAtTime(startFreq, now);
                    osc.frequency.linearRampToValueAtTime(endFreq, now + 0.3);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
                    osc.start(now);
                    osc.stop(now + 0.32);
                }
            } catch (e) {
                // Ignore audio context restrictions
            }
        }

        // Mandarin-only voice selection for iPad Safari and other browsers.
        // IMPORTANT: iPadOS can still override even an explicitly selected voice.
        // For guaranteed identical Mandarin across devices, use pre-recorded MP3 files.
        function isMandarinVoice(v) {
            const lang = String(v.lang || '').replace(/_/g, '-').toLowerCase();
            const name = String(v.name || '').toLowerCase();
            const uri = String(v.voiceURI || '').toLowerCase();
            if (/cantonese|yue|粵|粤|sin-ji|sinji/.test(name + ' ' + uri)) return false;
            if (/^(?:zh-(?:hk|mo)(?:-|$)|yue(?:-|$))/.test(lang)) return false;
            // zh-CN, zh-SG, zh-TW and cmn-* are Mandarin locales.
            return /^(?:zh-(?:cn|sg|tw)(?:-|$)|cmn(?:-|$))/.test(lang);
        }

        function getBestMandarinVoice() {
            if (!('speechSynthesis' in window)) return null;
            const voices = window.speechSynthesis.getVoices() || [];
            const choices = voices.filter(isMandarinVoice);
            if (!choices.length) return null; // NEVER fall back to a Cantonese / unknown voice.
            const priority = (v) => {
                const lang = String(v.lang || '').replace(/_/g, '-').toLowerCase();
                const name = String(v.name || '').toLowerCase();
                let score = 0;
                if (lang === 'zh-cn') score = 100;
                else if (lang.startsWith('zh-cn-') || lang.startsWith('cmn-hans-cn')) score = 90;
                else if (lang === 'zh-sg') score = 80;
                else if (lang.startsWith('cmn')) score = 70;
                else if (lang.startsWith('zh-tw')) score = 60;
                if (/ting-?ting|yu-?shu|xiaoxiao|putonghua/.test(name)) score += 3;
                return score;
            };
            choices.sort((a, b) => priority(b) - priority(a));
            return choices[0];
        }

        // Show a clear message rather than silently switching to Cantonese.
        function showMandarinVoiceWarning() {
            if (document.getElementById('mandarin-voice-warning')) return;
            const div = document.createElement('div');
            div.id = 'mandarin-voice-warning';
            div.setAttribute('role', 'status');
            div.style.cssText = 'position:fixed;z-index:1000;left:50%;bottom:18px;transform:translateX(-50%);max-width:640px;width:calc(100% - 32px);padding:12px 16px;background:#fff8db;color:#753800;border:2px solid #f59e0b;border-radius:16px;box-shadow:0 6px 22px #0003;font-size:15px;font-weight:700;line-height:1.5;text-align:center;';
            div.textContent = '⚠️ 未找到普通話語音，因此暫停朗讀，避免播出粵語。請到 iPad「設定 → 輔助使用 → 朗讀內容／閱讀與朗讀 → 聲音 → 中文」選擇普通話語音，然後重新載入網頁。';
            document.body.appendChild(div);

        function hideMandarinVoiceWarning() {

        function speakMandarin(text, speakerType = 'big') {
            if (!('speechSynthesis' in window) || !text) {
                showMandarinVoiceWarning();
                return false;

                if (!voice) {
                    window.speechSynthesis.cancel();
                    showMandarinVoiceWarning();
                    console.warn('[普通話朗讀] 裝置沒有提供可用的普通話語音。',
                        (window.speechSynthesis.getVoices() || []).map(v => ({name: v.name, lang: v.lang})));
                    return false;
                }
                hideMandarinVoiceWarning();
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.voice = voice;       // Must assign the actual Mandarin voice object.
                utter.lang = voice.lang;   // Match the selected voice's Mandarin locale.
                if (speakerType === 'big') {
                    utter.pitch = 0.88;
                    utter.rate = 0.92;
                } else if (speakerType === 'small') {
                    utter.pitch = 1.10;
                    utter.rate = 0.94;
                } else {
                    utter.pitch = 1.0;
                    utter.rate = 0.92;
                }
                utter.onerror = e => console.warn('[普通話朗讀] 無法播放：', e.error || e);
                window.speechSynthesis.speak(utter);
                return true;
            } catch (err) {
                console.warn('[普通話朗讀] 語音合成發生錯誤：', err);
                return false;
            }
        }

            };

        // Create Storybook Sun with dashed rays (top-left of sky like reference image)
        function createStorybookSun() {
            const sunGroup = new THREE.Group();
            const coreMat = new THREE.MeshBasicMaterial({ color: COLORS.sunOrange });
            const core = new THREE.Mesh(new THREE.SphereGeometry(3.2, 24, 24), coreMat);
            sunGroup.add(core);

            // Dashed rays around sun
            const rayCount = 14;
            for (let i = 0; i < rayCount; i++) {
                const angle = (i / rayCount) * Math.PI * 2;
                const ray = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.22, 0.22, 0.9, 8),
                    coreMat
                );
                ray.position.set(Math.cos(angle) * 4.3, Math.sin(angle) * 4.3, 0);
                ray.rotation.z = angle - Math.PI / 2;
                sunGroup.add(ray);
            }
            sunGroup.position.set(-18, 22, -32);
            return sunGroup;
        }

        // 2A. TALL BLOOMING FLOWER (花朵) - At Big Mouse's eye level (~6.8m)
        function createTallFlower(x, z, petalColor = 0xfacc15, height = 6.6) {
            const flowerGroup = new THREE.Group();
            const stemMat = new THREE.MeshLambertMaterial({ color: 0x65a30d });

            // Sturdy Tall Green Stem
            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, height, 12), stemMat);
            stem.position.y = height / 2;
            flowerGroup.add(stem);

            // Stem Leaves at mid height (above Little Mouse's root view so zero obstruction!)
            [-1, 1].forEach((dir, i) => {
                const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 12), stemMat);
                leaf.scale.set(1.6, 0.18, 0.65);
                leaf.position.set(dir * 0.55, 3.2 + i * 0.9, 0);
                leaf.rotation.z = dir * 0.4;
                flowerGroup.add(leaf);
            });

            // Flower Blossom Head tilted slightly toward the player
            const head = new THREE.Group();
            head.position.set(0, height, 0);
            head.rotation.x = 0.35;

            const center = new THREE.Mesh(
                new THREE.SphereGeometry(0.52, 16, 16),
                new THREE.MeshLambertMaterial({ color: 0xd97706 })
            );
            center.scale.set(1, 1, 0.45);
            head.add(center);

            const petalMat = new THREE.MeshLambertMaterial({ color: petalColor });
            const numPetals = 10;
            for (let i = 0; i < numPetals; i++) {
                const angle = (i / numPetals) * Math.PI * 2;
                const petal = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 12), petalMat);
                petal.scale.set(0.62, 1.45, 0.25);
                petal.position.set(Math.cos(angle) * 0.78, Math.sin(angle) * 0.78, -0.05);
                petal.rotation.z = angle - Math.PI / 2;
                head.add(petal);
            }

            flowerGroup.add(head);
            flowerGroup.position.set(x, 0, z);
            return flowerGroup;
        }

        /***********************************************************************
         * 5. SCENE BUILDERS FOR ALL 4 TEXTBOOK SCENES
         ***********************************************************************/
        function disposeHierarchy(node) {
            if (!node) return;
            node.traverse((child) => {
                if (child.geometry) {
                    child.geometry.dispose();
                }
                if (child.material) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(mat => mat.dispose());
                    } else {
                        child.material.dispose();
                    }
                }
            });
        }

        function clearCurrentScene() {
            while (sceneGroup.children.length > 0) {
                const obj = sceneGroup.children[0];
                sceneGroup.remove(obj);
                disposeHierarchy(obj);
            }
            while (companionGroup.children.length > 0) {
                const obj = companionGroup.children[0];
                companionGroup.remove(obj);
                disposeHierarchy(obj);
            }
            animatedObjects = [];
            interactiveTargets = [];
            rainDropMeshes = [];
            const labelsContainer = document.getElementById('labels-container');
            if (labelsContainer) labelsContainer.innerHTML = '';
        }

        // Strict Role Check: Can the current role click and read aloud this target?
        function isTargetSelectableByCurrentRole(targetInfo) {
            if (!targetInfo) return false;
            // In Scene 2, after clicking "遇上大雨！", do NOT show or read aloud Roof & Basement
            if (currentSceneIndex === 2 && isRainingInScene2) {
                if (targetInfo.stampId === 'roof' || targetInfo.stampId === 'basement') {
                    return false;
                }
            }
            // In Scene 3, after clicking "大個子把小不點兒舉起來看窗外彩虹！", do NOT show or read aloud Floor or Ceiling
            if (currentSceneIndex === 3 && isLiftedInScene3) {
                if (targetInfo.stampId === 'floor' || targetInfo.stampId === 'ceiling') {
                    return false;
                }
            }
            // In Scene 3, Rainbow is ONLY selectable & visible after Big Mouse lifts up Small Mouse
            if (targetInfo.stampId === 'rainbow') {
                return currentSceneIndex === 3 && isLiftedInScene3;
            }
            if (targetInfo.roleHint === 'both') return true;
            return targetInfo.roleHint === currentRole;
        }

        function registerInteractiveTarget(meshOrGroup, info) {
            const targetObj = {
                object: meshOrGroup,
                worldPos: info.worldPos, // Side-offset 3D anchor so label NEVER blocks the 3D object
                lookAtPos: info.lookAtPos || info.worldPos, // True center of the 3D object for camera aiming
                fixedScreenPos: info.fixedScreenPos || null,
                labelSide: info.labelSide || 'right', // 'left' | 'right' side callout
                hideSideLabel: !!info.hideSideLabel, // True for companion friend
                isCompanion: !!info.isCompanion,
                title: info.title,
                roleHint: info.roleHint, // 'big' | 'small' | 'both'
                stampId: info.stampId,
                speaker: info.speaker,
                speech: info.speech,
                explanation: info.explanation,
                domElement: null
            };

            if (!targetObj.hideSideLabel) {
                // Create side-offset HTML callout badge with leader line so text NEVER covers the 3D model
                const container = document.getElementById('labels-container');
                const el = document.createElement('div');
                const isLeft = targetObj.labelSide === 'left';
                el.className = `label-3d ${isLeft ? 'label-side-left' : 'label-side-right'}`;

                el.onclick = (e) => {
                    e.stopPropagation();
                    if (!isTargetSelectableByCurrentRole(targetObj)) return;
                    triggerTargetGreeting(targetObj);
                };
                container.appendChild(el);
                targetObj.domElement = el;
            }

            interactiveTargets.push(targetObj);
            refreshTargetLabelAppearance(targetObj);
        }

        // Scene Narration Helper (First-person narration for Small Mouse & Big Mouse)
        function getSceneNarrationText(role = currentRole, sceneIdx = currentSceneIndex, raining = isRainingInScene2, lifted = isLiftedInScene3, greeting = isGreetingStep) {
            if (greeting) {
                return role === 'big'
                    ? '我與小不點兒見面時，總是這樣打招呼。'
                    : '我與大個子見面時，總是這樣打招呼。';
            }
            if (role === 'small') {
                if (sceneIdx === 0) return '散步時，我在低低的草叢裏看到了獨角仙。';
                if (sceneIdx === 1) return '走過院子的時候，我在大樹底下看到了粗壯的樹根。';
                if (sceneIdx === 2) {
                    return raining
                        ? '遇上大雨時，我看到了地面積起的水坑。'
                        : '從屋子旁邊走過時，我看到了牆角低處的地下室。';
                }
                if (sceneIdx === 3) {
                    return lifted
                        ? '大雨停了，大個子想讓我看看窗外的景色，就把我舉了起來。我們一齊看到了窗外美麗的彩虹。'
                        : '跑進屋子躲雨時，我個子小，一進屋就看到腳下的地板。';
                }
            } else {
                if (sceneIdx === 0) return '散步時，我在高高的樹上看到了小鳥。';
                if (sceneIdx === 1) return '走過院子的時候，我看到了正在盛開的花朵。';
                if (sceneIdx === 2) {
                    return raining
                        ? '遇上大雨時，我看到了空中落下的雨點兒。'
                        : '從屋子旁邊走過時，我看到了高處的紅瓦屋頂。';
                }
                if (sceneIdx === 3) {
                    return lifted
                        ? '大雨停了，我想讓小不點兒看看窗外的景色，就把小不點兒舉了起來。我們一齊看到了窗外美麗的彩虹。'
                        : '跑進屋子躲雨時，我個子高，一進屋就看到頭頂上的天棚。';
                }
            }
            return '';
        }

        function speakCurrentSceneNarration() {
            const modal = document.getElementById('welcome-modal');
            if (modal && !modal.classList.contains('hidden')) return;
            const text = getSceneNarrationText(currentRole, currentSceneIndex, isRainingInScene2, isLiftedInScene3, isGreetingStep);
            if (text) {
                const expEl = document.getElementById('vision-explanation');
                if (expEl) {
                    expEl.textContent = `💡 ${text}`;
                }
                speakMandarin(text, currentRole);
            }
        }

        function refreshTargetLabelAppearance(targetObj) {
            if (!targetObj || !targetObj.domElement) return;
            const el = targetObj.domElement;
            const canSelect = isTargetSelectableByCurrentRole(targetObj);
            const isLeft = targetObj.labelSide === 'left';

            // Do not display the label if it is hidden or does not belong to the current state/role
            if (targetObj.hideSideLabel || !canSelect) {
                el.className = `label-3d ${isLeft ? 'label-side-left' : 'label-side-right'} label-disabled`;
                el.style.display = 'none';
                return;
            }

            el.style.display = 'block';
            el.className = `label-3d ${isLeft ? 'label-side-left' : 'label-side-right'} label-active`;

            let badgeStyle = 'bg-white/95 border-amber-500 text-amber-950';
            let dotColor = 'bg-amber-400 border-white';
            let lineColor = 'bg-amber-400';

            if (targetObj.roleHint === 'big') {
                badgeStyle = 'bg-red-500 text-white border-white ring-4 ring-red-300/60';
                dotColor = 'bg-red-500 border-white';
                lineColor = 'bg-white';
            } else if (targetObj.roleHint === 'small') {
                badgeStyle = 'bg-amber-400 text-amber-950 border-white ring-4 ring-amber-200/70';
                dotColor = 'bg-amber-400 border-white';
                lineColor = 'bg-white';
            } else {
                badgeStyle = 'bg-gradient-to-r from-red-500 via-amber-400 to-emerald-500 text-white border-white ring-4 ring-amber-200/70';
                dotColor = 'bg-yellow-300 border-white';
                lineColor = 'bg-white';
            }

            const connectorHTML = isLeft
                ? `<div class="flex items-center shrink-0">
                       <div class="w-6 md:w-9 h-1 ${lineColor} shadow-sm rounded-full"></div>
                       <div class="w-3.5 h-3.5 rounded-full ${dotColor} border-2 shadow-md"></div>
                   </div>`
                : `<div class="flex items-center shrink-0">
                       <div class="w-3.5 h-3.5 rounded-full ${dotColor} border-2 shadow-md"></div>
                       <div class="w-6 md:w-9 h-1 ${lineColor} shadow-sm rounded-full"></div>
                   </div>`;

            // Side label only displays Traditional Chinese object name without speaker icon
            const pillHTML = `
                <div class="label-pill transition-transform px-4 py-2 rounded-2xl border-2 shadow-xl font-black text-lg md:text-xl flex items-center justify-center whitespace-nowrap ${badgeStyle}">
                    <span>${targetObj.title}</span>
                </div>
            `;

            el.innerHTML = `
                <div class="animate-float flex items-center">
                    ${isLeft ? pillHTML + connectorHTML : connectorHTML + pillHTML}
                </div>
            `;
        }

        function refreshAllTargetLabels() {
            interactiveTargets.forEach(t => refreshTargetLabelAppearance(t));
        }

        // Spawn Companion Friend next to player
        // In Greeting Step (isGreetingStep === true), friend stands right in front and when greeted, Big Mouse looks down to see the whole Small Mouse, while Small Mouse looks up to see Big Mouse's upper body!
        function buildCompanionFriend() {
            while (companionGroup.children.length > 0) {
                const obj = companionGroup.children[0];
                companionGroup.remove(obj);
                disposeHierarchy(obj);
            }
            // Remove any previous companion interactive entries
            interactiveTargets = interactiveTargets.filter(t => !t.isCompanion);

            if (currentRole === 'big') {
                const smallFriend = createMouseCharacter('small');
                const friendY = (currentSceneIndex === 3 && isLiftedInScene3) ? 5.2 : 0;
                const posX = isGreetingStep ? 0 : -2.4;
                const posZ = isGreetingStep ? -6.2 : -4.2;
                smallFriend.position.set(posX, friendY, posZ);
                smallFriend.rotation.y = isGreetingStep ? 0 : 0.55;
                companionGroup.add(smallFriend);

                registerInteractiveTarget(smallFriend, {
                    worldPos: new THREE.Vector3(posX + 0.95, friendY + 0.95, posZ),
                    lookAtPos: new THREE.Vector3(posX, friendY + 0.85, posZ),
                    fixedScreenPos: isGreetingStep ? { xPct: 58, yPct: 54 } : null,
                    labelSide: 'right',
                    hideSideLabel: true,
                    isCompanion: true,
                    title: '小不點兒',
                    roleHint: 'big',
                    stampId: null,
                    speaker: 'big',
                    speech: '嘿，小不點兒。',
                    explanation: '💡 我與小不點兒見面時，總是這樣打招呼。'
                });
            } else {
                const bigFriend = createMouseCharacter('big');
                const posX = isGreetingStep ? 0 : -2.8;
                const posZ = isGreetingStep ? -5.8 : -4.6;
                bigFriend.position.set(posX, 0, posZ);
                bigFriend.rotation.y = isGreetingStep ? 0 : 0.5;
                companionGroup.add(bigFriend);

                registerInteractiveTarget(bigFriend, {
                    worldPos: new THREE.Vector3(posX + 1.55, 5.0, posZ),
                    lookAtPos: new THREE.Vector3(posX, 5.0, posZ),
                    fixedScreenPos: isGreetingStep ? { xPct: 62, yPct: 45 } : null,
                    labelSide: 'right',
                    hideSideLabel: true,
                    isCompanion: true,
                    title: '大個子',
                    roleHint: 'small',
                    stampId: null,
                    speaker: 'small',
                    speech: '嘿，大個子。',
                    explanation: '💡 我與大個子見面時，總是這樣打招呼。'
                });
            }
        }

        function createPastelGround(colorHex = COLORS.grassLight) {
            const ground = new THREE.Mesh(
                new THREE.CircleGeometry(90, 48),
                new THREE.MeshLambertMaterial({ color: colorHex })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            sceneGroup.add(ground);

            // Decorative soft grass tufts far on the sides (NEVER in front of low targets!)
            const tuftMat = new THREE.MeshLambertMaterial({ color: COLORS.grassMid });
            for (let i = 0; i < 36; i++) {
                const angle = (i / 36) * Math.PI * 2;
                const dist = 14 + (i % 4) * 5;
                const tx = Math.cos(angle) * dist;
                const tz = Math.sin(angle) * dist;
                // Keep center viewing corridor completely clear!
                if (Math.abs(tx) < 5 && tz < 2 && tz > -16) continue;
                const blade = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1.4, 5), tuftMat);
                blade.position.set(tx, 0.7, tz);
                sceneGroup.add(blade);
            }
        }

        // =====================================================================
        // SCENE 0: 散步時 (小鳥 high on branch vs 獨角仙 low on trunk)
        // =====================================================================
        function buildScene0_Forest() {
            scene.background = new THREE.Color(COLORS.skySunny);
            scene.fog = new THREE.FogExp2(COLORS.skySunny, 0.01);
            createPastelGround(COLORS.grassLight);
            sceneGroup.add(createStorybookSun());

            // Main Hero Tree right in front (Unobstructed!)
            const treeGroup = new THREE.Group();
            treeGroup.position.set(0, 0, -7.2);

            const trunkMat = new THREE.MeshLambertMaterial({ color: COLORS.treeBark });
            const mainTrunk = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 1.05, 11, 18), trunkMat);
            mainTrunk.position.y = 5.5;
            treeGroup.add(mainTrunk);

            // Low Wooden Stump & Bark Perch for Rhinoceros Beetles (at y = 1.25, Little Mouse's exact eye level!)
            const lowLog = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.78, 1.2, 16), trunkMat);
            lowLog.position.set(0.65, 0.6, 1.15);
            treeGroup.add(lowLog);

            // Place Two Clear Rhinoceros Beetles (獨角仙) right in front at Little Mouse eye level
            const beetlesHolder = new THREE.Group();
            beetlesHolder.position.set(0.3, 1.28, -6.05);

            const beetle1 = createBeetleModel();
            beetle1.scale.set(0.85, 0.85, 0.85);
            beetle1.position.set(-0.35, 0.08, 0.15);
            beetle1.rotation.y = -0.35;
            beetlesHolder.add(beetle1);

            const beetle2 = createBeetleModel();
            beetle2.scale.set(0.75, 0.75, 0.75);
            beetle2.position.set(0.55, 0.35, -0.35);
            beetle2.rotation.y = -2.4;
            beetle2.rotation.z = 0.35;

            sceneGroup.add(createStorybookSun());

            buildCompanionFriend();
            refreshAllTargetLabels();
            updateTopButtonsUI();
            updateSpecialActionBar();
            updateDefaultScenePrompt(false);

            // Start from horizontal straight-ahead view; when the player presses "👋 與好朋友打招呼。" or clicks the friend, the camera tilts to look at the friend
            resetLookFront();
        }

        function enterWalkingSceneFromGreeting() {
            isGreetingStep = false;
            hasGreetedFriend = false;
            playChimeSound('switch');
            resetLookFront();
            buildScene(0);
            speakCurrentSceneNarration();
        }

        // Switch directly to the "打招呼時" Greeting Scene from the top scene bar
        function changeToGreetingScene() {
            playChimeSound('switch');
            isGreetingStep = true;
            hasGreetedFriend = false;
            isLiftedInScene3 = false;
            targetEyeY = currentRole === 'big' ? EYE_HEIGHT_BIG : EYE_HEIGHT_SMALL;
            buildGreetingScene();
            speakCurrentSceneNarration();
        }

        function buildScene(index) {
            currentSceneIndex = index;
            if (isGreetingStep) {
                buildGreetingScene();
                return;
            }
            clearCurrentScene();

            if (index === 0) buildScene0_Forest();
            else if (index === 1) buildScene1_Yard();
            else if (index === 2) buildScene2_HouseBeside();
            else if (index === 3) buildScene3_Indoors();

            buildCompanionFriend();
            refreshAllTargetLabels();
            updateTopButtonsUI();
            updateSpecialActionBar();
            updateDefaultScenePrompt(false);
        }

        // After selecting a character, start at the Greeting Step where the player sees their friend and immediately hears the greeting narration in Mandarin
        function startGameWithRole(role) {
            if (welcomeIntroTimer) {
                clearTimeout(welcomeIntroTimer);
                welcomeIntroTimer = null;
            }
            hasSpokenWelcomeIntro = true;
            initAudio();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById('welcome-modal').classList.add('hidden');
            currentRole = role;
            currentSceneIndex = 0;
            isGreetingStep = true;
            hasGreetedFriend = false;
            isRainingInScene2 = false;
            hasClickedSunnyTargetInScene2 = false;
            isLiftedInScene3 = false;
            hasClickedIndoorTargetInScene3 = false;
            targetEyeY = role === 'big' ? EYE_HEIGHT_BIG : EYE_HEIGHT_SMALL;
            currentEyeY = targetEyeY;
            buildGreetingScene();
            speakCurrentSceneNarration();
        }

        // Every time the character is switched, start from that character's straight-ahead eye-level view
        function switchRole(role, isInitial = false) {
            currentRole = role;
            isLiftedInScene3 = false; // Reset lifted state so the student experiences the character's true eye height
            targetEyeY = role === 'big' ? EYE_HEIGHT_BIG : EYE_HEIGHT_SMALL;

            if (!isInitial) playChimeSound('switch');

            if (isGreetingStep) {
                hasGreetedFriend = false;
                buildGreetingScene();
                speakCurrentSceneNarration();
                return;
            }

            // Immediately start from straight-ahead horizontal view (pitch = 0, yaw = 0)
            resetLookFront();

            if (currentSceneIndex === 3) {
                buildScene(3);
            } else {
                buildCompanionFriend();
                refreshAllTargetLabels();
                updateTopButtonsUI();
                updateSpecialActionBar();
                updateDefaultScenePrompt(false);
            }

            if (!isInitial) {
                speakCurrentSceneNarration();
            }
        }

        function changeScene(index) {
            playChimeSound('switch');
            isGreetingStep = false;
            hasGreetedFriend = false;
            if (index !== 2) {
                isRainingInScene2 = false;
                hasClickedSunnyTargetInScene2 = false;
            }
            if (index !== 3) {
                isLiftedInScene3 = false;
                hasClickedIndoorTargetInScene3 = false;
            }
            targetEyeY = currentRole === 'big' ? EYE_HEIGHT_BIG : EYE_HEIGHT_SMALL;
            resetLookFront();
            buildScene(index);
            speakCurrentSceneNarration();
        }

        // "下一個情境" advances from Greeting Step -> Scene 0, or to the next textbook scene in order
        function goToNextLocation() {
            if (isGreetingStep) {
                enterWalkingSceneFromGreeting();
                return;
            }
            const nextIndex = (currentSceneIndex + 1) % 4;
            changeScene(nextIndex);
        }

        // Activate heavy rain in Scene 2 (One-way trigger, hides button & removes roof/basement)
        function triggerScene2Rain() {

            playChimeSound('switch');
            buildScene(2);

        function triggerTargetGreeting(targetInfo) {
            // Strict Role Filter: Only allow reading aloud objects belonging to the currently selected role
            if (!isTargetSelectableByCurrentRole(targetInfo)) return;

            // Smoothly turn first-person camera toward the 3D object's center!
            aimCameraAtPoint(targetInfo.lookAtPos || targetInfo.worldPos);

            updateSpeechPanel(targetInfo);
            playChimeSound('greet');
            speakMandarin(targetInfo.speech, targetInfo.speaker);

            // If in Greeting Step and player greeted their friend, hide the greeting prompt button immediately
            if (isGreetingStep && targetInfo.isCompanion) {
                hasGreetedFriend = true;
                updateSpecialActionBar();

            if (targetInfo.stampId) {
                collectedStamps.add(targetInfo.stampId);
                document.getElementById('stamp-counter').textContent = `${collectedStamps.size}/${STORY_STAMP_ITEMS.length}`;

                // Unlock "遇上大雨！" button after clicking roof or basement in Scene 2
                if (targetInfo.stampId === 'roof' || targetInfo.stampId === 'basement') {
                    hasClickedSunnyTargetInScene2 = true;
                    updateSpecialActionBar();

                // Unlock "大個子把小不點兒舉起來看窗外彩虹！" button after clicking ceiling or floor in Scene 3
                if (targetInfo.stampId === 'ceiling' || targetInfo.stampId === 'floor') {
                    hasClickedIndoorTargetInScene3 = true;
                    updateSpecialActionBar();
                }
            }
        }

        function aimCameraAtPoint(worldPoint) {
            const dx = worldPoint.x - camera.position.x;
            const dy = worldPoint.y - targetEyeY;
            const dz = worldPoint.z - camera.position.z;
            const horizDist = Math.sqrt(dx * dx + dz * dz);

            targetYaw = Math.atan2(-dx, -dz);
            targetPitch = Math.atan2(dy, horizDist);
            targetPitch = Math.max(-1.05, Math.min(1.05, targetPitch));
        }

        function nudgeCamera(deltaYaw, deltaPitch) {
            targetYaw = Math.max(-1.2, Math.min(1.2, targetYaw + deltaYaw));
            targetPitch = Math.max(-1.05, Math.min(1.05, targetPitch + deltaPitch));
        }

        function resetLookFront() {
            targetYaw = 0;
            targetPitch = 0;
        }

        /***********************************************************************
         * 8. POINTER / TOUCH FIRST-PERSON CAMERA CONTROLS & ANIMATION LOOP
         ***********************************************************************/
        function setupInteractionEvents(domElement) {
            let isDragging = false;
            let startX = 0, startY = 0;
            let dragDistance = 0;

            domElement.addEventListener('pointerdown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                dragDistance = 0;
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                dragDistance += Math.abs(dx) + Math.abs(dy);
                startX = e.clientX;
                startY = e.clientY;

                targetYaw = Math.max(-1.25, Math.min(1.25, targetYaw + dx * 0.0045));
                targetPitch = Math.max(-1.05, Math.min(1.05, targetPitch + dy * 0.0045));
            });

            window.addEventListener('pointerup', (e) => {
                if (isDragging && dragDistance < 10) {
                    handleCanvasClick(e);
                }
                isDragging = false;
            });

            // Keyboard arrow keys support
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp') nudgeCamera(0, 0.18);
                else if (e.key === 'ArrowDown') nudgeCamera(0, -0.18);
                else if (e.key === 'ArrowLeft') nudgeCamera(0.18, 0);
                else if (e.key === 'ArrowRight') nudgeCamera(-0.18, 0);
            });
        }

        function handleCanvasClick(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            for (const item of interactiveTargets) {
                // Only allow clicking 3D objects that belong to the currently selected role
                if (!isTargetSelectableByCurrentRole(item)) continue;
                const intersects = raycaster.intersectObject(item.object, true);
                if (intersects.length > 0) {
                    triggerTargetGreeting(item);
                    break;
                }
            }
        }

        function update3DLabels() {
            // Anchor each object's side label directly beside its 3D object position on screen,
            // and automatically hide the label whenever the 3D object is outside the camera's visible screen view!
            camera.updateMatrixWorld();
            const projScreenMatrix = new THREE.Matrix4();
            projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            const frustum = new THREE.Frustum();
            frustum.setFromProjectionMatrix(projScreenMatrix);

            interactiveTargets.forEach(item => {
                if (!item.domElement) return;
                const canSelect = isTargetSelectableByCurrentRole(item);

                // Directly hide the label if it does not belong to the current role/state or if the 3D object itself is hidden
                if (item.hideSideLabel || !canSelect || (item.object && !item.object.visible)) {
                    item.domElement.style.display = 'none';
                    item.domElement.style.pointerEvents = 'none';
                    return;
                }

                // Check if the 3D object and its side anchor are visible inside the camera view
                const objCenter = item.lookAtPos || item.worldPos;
                const anchorPos = item.worldPos;

                const projectedCenter = objCenter.clone().project(camera);
                const projectedAnchor = anchorPos.clone().project(camera);

                // If the object is behind the camera or rotated out of the visible screen bounds, hide the label
                const isObjectOnScreen =
                    frustum.containsPoint(objCenter) &&
                    projectedCenter.z >= -1 && projectedCenter.z <= 1 &&
                    projectedCenter.x >= -0.95 && projectedCenter.x <= 0.95 &&
                    projectedCenter.y >= -0.92 && projectedCenter.y <= 0.92;

                if (!isObjectOnScreen) {
                    item.domElement.style.display = 'none';
                    item.domElement.style.pointerEvents = 'none';
                    return;
                }

                // Position the label locked right next to the 3D object's side anchor on screen
                const screenX = (projectedAnchor.x * 0.5 + 0.5) * window.innerWidth;
                const screenY = (-projectedAnchor.y * 0.5 + 0.5) * window.innerHeight;

                item.domElement.style.display = 'block';
                item.domElement.style.left = `${screenX}px`;
                item.domElement.style.top = `${screenY}px`;
                item.domElement.style.opacity = '1';
                item.domElement.style.pointerEvents = 'auto';
            });

            // Update crosshair pitch hint text so students understand head tilt!
            const hintEl = document.getElementById('eye-level-hint');
            if (camPitch > 0.25) {
                hintEl.textContent = '👀 正在抬頭往高處看';
            } else if (camPitch < -0.25) {
                hintEl.textContent = '👀 正在低頭往低處看';
            } else {
                hintEl.textContent = currentRole === 'big' ? '👀 大個子平視前方' : (isLiftedInScene3 ? '👀 被大個子舉高平視窗外' : '👀 小不點兒平視前方');
            }
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        }

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            // Smooth camera eye-height & head-turn interpolation
            currentEyeY += (targetEyeY - currentEyeY) * 0.08;
            camYaw += (targetYaw - camYaw) * 0.12;
            camPitch += (targetPitch - camPitch) * 0.12;

            camera.position.y = currentEyeY;
            camera.rotation.order = 'YXZ';
            camera.rotation.y = camYaw;
            camera.rotation.x = camPitch;

            // Animate birds & beetles
            animatedObjects.forEach((obj, i) => {
                if (obj.type === 'bird' && obj.mesh) {
                    obj.mesh.position.y = Math.sin(elapsed * 3.5 + i) * 0.06;
                    if (obj.mesh.userData.wings) {
                        obj.mesh.userData.wings[0].rotation.x = 0.35 + Math.sin(elapsed * 9 + i) * 0.25;
                        obj.mesh.userData.wings[1].rotation.x = -0.35 - Math.sin(elapsed * 9 + i) * 0.25;
                    }
                } else if (obj.type === 'beetle' && obj.mesh) {
                    obj.mesh.position.x = obj.basePos.x + Math.sin(elapsed * 1.6) * 0.08;
                }
            });

            // Animate falling 3D raindrops in Scene 2 Rain mode
            rainDropMeshes.forEach(drop => {
                drop.position.y -= 0.14;
                if (drop.position.y < 0.4) {
                    drop.position.y = 9.5;
                }
            });

            update3DLabels();
            renderer.render(scene, camera);
        }

        // Speak the opening story sentence in Mandarin (zh-CN) immediately upon opening the link / entering the role-selection page
        function scheduleWelcomeIntroSpeech() {
            const welcomeText = '從前，有一隻個子很大的老鼠和一隻個子很小的老鼠。他們兩個是好朋友。';

            const trySpeakNow = () => {
                const modal = document.getElementById('welcome-modal');
                if (!modal || modal.classList.contains('hidden') || hasSpokenWelcomeIntro) return;
                if ('speechSynthesis' in window) {
                    const voices = window.speechSynthesis.getVoices();
                    if (voices && getBestMandarinVoice()) {
                        hasSpokenWelcomeIntro = speakMandarin(welcomeText, 'both');
                    }
                }
            };

            // Try immediately on page load
            trySpeakNow();

            // Also trigger as soon as browser voices finish loading
            if ('speechSynthesis' in window) {
                window.speechSynthesis.addEventListener('voiceschanged', trySpeakNow, { once: true });
            }

            // Fallback short retry in case voices took a moment to initialize
            welcomeIntroTimer = setTimeout(() => {
                const modal = document.getElementById('welcome-modal');
                if (!modal || modal.classList.contains('hidden') || hasSpokenWelcomeIntro) return;
                hasSpokenWelcomeIntro = speakMandarin(welcomeText, 'both');
            }, 150);

            // Fallback for browsers (like iPad Safari) that require a touch gesture to unlock SpeechSynthesis if autoplay was blocked
            const unlockWelcomeSpeech = (e) => {
                if (e.target && e.target.closest && e.target.closest('[onclick*="startGameWithRole"]')) {
                    window.removeEventListener('pointerdown', unlockWelcomeSpeech);
                    return;
                }
                const modal = document.getElementById('welcome-modal');
                if (modal && !modal.classList.contains('hidden')) {
                    if (welcomeIntroTimer) clearTimeout(welcomeIntroTimer);
                    hasSpokenWelcomeIntro = speakMandarin(welcomeText, 'both');
                }
                window.removeEventListener('pointerdown', unlockWelcomeSpeech);
            };
            window.addEventListener('pointerdown', unlockWelcomeSpeech);
        }

        window.onload = function () {
            initThreeJS();
            animate();
            scheduleWelcomeIntroSpeech();
        };
    </script>
</body>
</html>
